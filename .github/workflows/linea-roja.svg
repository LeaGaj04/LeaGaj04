<svg width="100%" height="4" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradiente" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#E05D5D" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200%" height="4" fill="url(#gradiente)">
    <animate attributeName="x" from="-100%" to="100%" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>
